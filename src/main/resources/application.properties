spring.application.name=springbootdemo
server.port=8080

# MySQL 数据源配置
spring.datasource.url=jdbc:mysql://localhost:3306/springbootdemo?useSSL=false&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 密码通过环境变量 DB_PASSWORD 注入，不写入仓库
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP 连接池调优
# 注意：池上限必须小于 MySQL 的 max_connections，否则并发上来后会拿不到连接。
# 本机 MySQL（C:/soft/mysql/mysql-8.0.19-winx64/my.ini）配的是 max_connections=20，
# 还要留出 IDEA 数据源等客户端的额度，故这里取 10。
# 若 UAT/生产环境的 max_connections 更大，可相应调高。
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Tomcat 线程池调优
server.tomcat.threads.max=300
server.tomcat.threads.min-spare=30
server.tomcat.accept-count=200
server.tomcat.max-connections=8192

# MyBatis-Plus 配置
mybatis-plus.mapper-locations=classpath*:/mapper/*.xml
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ==================== 接口鉴权 ====================
# 总开关。true：/api/** 必须携带令牌；false：不校验（仅供本地开发，UAT/生产必须为 true）
app.auth.enabled=${APP_AUTH_ENABLED:true}
# 免鉴权路径（探活用），多个用英文逗号分隔
app.auth.exclude-paths=/api/hello/**

# 令牌值一律通过环境变量注入，不写入仓库（同 DB_PASSWORD 的处理原则）
# 未设置环境变量的用户会被自动跳过，账号不可用；不会退化成"空令牌即可通过"

# 风险管理员：查看报告、处置预警
app.auth.users[0].username=risk-admin
app.auth.users[0].description=风险管理员
app.auth.users[0].roles=RISK_ADMIN
app.auth.users[0].token=${APP_TOKEN_RISK_ADMIN:}

# 风险审批人：查看报告；处置接口不在其权限内（可用来演示 403）
app.auth.users[1].username=risk-approver
app.auth.users[1].description=风险审批人
app.auth.users[1].roles=RISK_APPROVER
app.auth.users[1].token=${APP_TOKEN_RISK_APPROVER:}

# 接口调用方：源头系统，推送贷后数据（POST /api/agent/ingest）
app.auth.users[2].username=api-client
app.auth.users[2].description=源头系统接口调用方
app.auth.users[2].roles=API_CLIENT
app.auth.users[2].token=${APP_TOKEN_API_CLIENT:}

# 系统管理员：全量权限，用于演示一个身份持有多个角色
app.auth.users[3].username=sys-admin
app.auth.users[3].description=系统管理员
app.auth.users[3].roles=SYS_ADMIN,RISK_ADMIN,RISK_APPROVER
app.auth.users[3].token=${APP_TOKEN_SYS_ADMIN:}
